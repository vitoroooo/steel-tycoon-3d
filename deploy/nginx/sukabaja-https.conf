# Satu alamat HTTPS untuk game: /v1/ ke server pasar, /career/ ke server karier. Keduanya hanya mendengarkan di 127.0.0.1.
limit_req_zone $binary_remote_addr zone=sukabaja:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # token ada di header Authorization dan tidak pernah di alamat, jadi log akses tidak memuatnya
    client_max_body_size 64k;
    limit_req zone=sukabaja burst=40 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 20s;

    location /v1/     { proxy_pass http://127.0.0.1:8765; }
    location /career/ { proxy_pass http://127.0.0.1:8766; }
    location /        { return 404; }
}
